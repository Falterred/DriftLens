name: Linux Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          # The release gates' nested full-suite runners re-execute the entire
          # suite recursively (~4x cost). CI runs the suite directly once; the
          # gates' own non-recursive assertions still execute in full.
          DRIFTLENS_SKIP_NESTED_SUITE: "1"
        run: python -m pytest -v