[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlens"
version = "1.0.0"
description = "Offline git diff for RAG knowledge bases and embedding datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "PyYAML>=6",
    "regex>=2023.8.8",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
chroma = ["chromadb==1.5.9"]
cluster = ["scikit-learn>=1.3", "hdbscan>=0.8.33"]
dev = ["pytest>=8", "faiss-cpu>=1.7.4", "chromadb==1.5.9", "scikit-learn>=1.3", "hdbscan>=0.8.33"]

[project.scripts]
driftlens = "driftlens.__main__:main"

[tool.setuptools.packages.find]
include = ["driftlens*"]

[tool.pytest.ini_options]
markers = [
    "extras: needs an optional extra",
    "benchmark_scale: large benchmark fixture tiers (10K/100K/1M)",
]
testpaths = ["tests"]
